<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Migratech AI Assistant</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="chat-container">
        <!-- Header -->
        <header class="chat-header">
            <div class="header-brand">
                <div class="brand-avatar">M</div>
                <div class="brand-info">
                    <h1>Migratech Assistant</h1>
                    <span class="status-indicator">
                        <span class="status-dot"></span> Online | 360° Digital Product Studio
                    </span>
                </div>
            </div>
            <div class="header-actions">
                <button id="clear-chat" title="Clear Chat" aria-label="Clear Chat">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                </button>
            </div>
        </header>

        <!-- Chat Messages Area -->
        <div id="chat-messages" class="chat-messages">
            <div class="message bot-message">
                <div class="message-avatar">M</div>
                <div class="message-content">
                    <p>Hello! Welcome to <strong>Migratech Softwares</strong>. I am your virtual assistant. How can I help you with our web development, software solutions, products, or services today?</p>
                    <span class="message-time">Just now</span>
                </div>
            </div>
        </div>

        <!-- Suggested Quick Prompts -->
        <div class="quick-prompts">
            <button class="prompt-chip" data-query="What services does Migratech offer?">Services</button>
            <button class="prompt-chip" data-query="What products do you have?">Products</button>
            <button class="prompt-chip" data-query="How can I contact Migratech?">Contact Info</button>
            <button class="prompt-chip" data-query="What are your working hours?">Working Hours</button>
        </div>

        <!-- Chat Input Area -->
        <form id="chat-form" class="chat-input-area">
            <input 
                type="text" 
                id="user-input" 
                placeholder="Type your message here..." 
                autocomplete="off" 
                required
            >
            <button type="submit" id="send-button" aria-label="Send message">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
